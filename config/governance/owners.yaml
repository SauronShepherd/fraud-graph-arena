policy_id: FGA-OWNERS-1.0-20260726
version: "1.0"
teams:
  architecture-governance: {purpose: architecture and normative authority}
  delivery-governance: {purpose: task stage and iteration process}
  quality-engineering: {purpose: verification evidence and test policy}
  security-assurance: {purpose: independent security privacy and truth-boundary review}
  release-management: {purpose: release evidence and handover approval}
  developer-experience: {purpose: repository tooling and automation}
assignments:
  - {path: README.md, owner: delivery-governance, reviewer: architecture-governance}
  - {path: .gitignore, owner: developer-experience, reviewer: quality-engineering}
  - {path: .gitattributes, owner: developer-experience, reviewer: quality-engineering}
  - {path: pyproject.toml, owner: developer-experience, reviewer: quality-engineering}
  - {path: .env.example, owner: developer-experience, reviewer: security-assurance}
  - {path: APPLY_ITERATION_01.md, owner: delivery-governance, reviewer: architecture-governance}
  - {path: Dockerfile, owner: developer-experience, reviewer: quality-engineering}
  - {path: compose.yaml, owner: developer-experience, reviewer: quality-engineering}
  - {path: contracts/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: case-data/**, owner: quality-engineering, reviewer: security-assurance}
  - {path: apps/**, owner: developer-experience, reviewer: quality-engineering}
  - {path: src/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: docs/governance/**, owner: architecture-governance, reviewer: security-assurance}
  - {path: docs/delivery/**, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/testing/**, owner: quality-engineering, reviewer: security-assurance}
  - {path: docs/iteration-01/**, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/iteration-02/**, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/iteration-03/**, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/iteration-04/**, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/iteration-05/**, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/iteration-05-*.md, owner: delivery-governance, reviewer: architecture-governance}
  - {path: docs/iteration-05-SECURITY.md, owner: security-assurance, reviewer: quality-engineering}
  - {path: docs/architecture/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: config/governance/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: config/lakehouse/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: schemas/governance/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: schemas/testing/**, owner: quality-engineering, reviewer: architecture-governance}
  - {path: schemas/canonical/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: src/fraud_graph_arena/case_data/**, owner: architecture-governance, reviewer: security-assurance}
  - {path: contracts/canonical/**, owner: architecture-governance, reviewer: security-assurance}
  - {path: config/canonical-corpus.v1.json, owner: architecture-governance, reviewer: release-management}
  - {path: config/lakehouse/destructive-environments.v1.json, owner: security-assurance, reviewer: architecture-governance}
  - {path: src/fraud_graph_arena/canonical_persistence/**, owner: architecture-governance, reviewer: security-assurance}
  - {path: sql/**, owner: architecture-governance, reviewer: quality-engineering}
  - {path: reports/**, owner: quality-engineering, reviewer: release-management}
  - {path: scripts/**, owner: developer-experience, reviewer: quality-engineering}
  - {path: tests/**, owner: quality-engineering, reviewer: architecture-governance}
  - {path: specifications/**, owner: architecture-governance, reviewer: release-management}
constraints:
  owner_and_reviewer_must_differ: true
  every_governed_path_must_match: true
  most_specific_path_wins: true
