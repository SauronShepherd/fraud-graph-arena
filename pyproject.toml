[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-graph-arena"
version = "0.0.0"
description = "Fraud Graph Arena modular implementation and qualification workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
]

[tool.setuptools]
packages = []
include-package-data = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
markers = [
  "governance: Iteration governance and closure-policy tests",
]
