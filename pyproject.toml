[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-graph-arena"
version = "0.1.0"
description = "Fraud Graph Arena modular implementation and qualification workspace"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "jsonschema==4.26.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.1",
  "PyYAML==6.0.3",
  "uvicorn[standard]==0.48.0",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["fraud_graph_arena*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = [
  "--strict-config",
  "--strict-markers",
]
markers = [
  "governance: Iteration governance and closure-policy tests",
  "architecture: Enforced module-boundary tests",
  "integration: Tests crossing two or more public module contracts",
]
