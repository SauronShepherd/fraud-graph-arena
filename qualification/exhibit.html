<!doctype html><meta charset="utf-8"><title>FGA06 renderer qualification exhibit</title><style>body{font:16px system-ui;background:#17130f;color:#f1e7d0;margin:2rem}svg{background:#211a14;border:1px solid #d9b46c;max-width:900px;width:100%}button{margin:.25rem;padding:.5rem;background:#d9b46c;border:0}#details,#legend{margin-top:1rem;padding:1rem;border:1px solid #77644b}</style><h1>FGA06 qualification exhibit</h1><p>This dependency-free baseline proves the shared fixture, stable IDs, viewport controls, and semantic fallback path. It is not a renderer benchmark.</p><p><button id="zoom-in">Zoom in</button><button id="zoom-out">Zoom out</button><button id="fit">Fit/reset</button></p><svg id="graph" viewBox="0 0 520 180" role="img" aria-label="Fixture graph"></svg><div id="legend" aria-label="Fixture legend">Nodes: 4 · Relationships: 3 · Person: 2 · Organization: 2</div><div id="details" aria-live="polite">Select a node or relationship.</div><script>const f={nodes:[{id:'FIX-N-0000',label:'Person 0000',kind:'Person',x:80,y:90},{id:'FIX-N-0001',label:'Org 0001',kind:'Organization',x:220,y:40},{id:'FIX-N-0002',label:'Org 0002',kind:'Organization',x:360,y:90},{id:'FIX-N-0003',label:'Person 0003',kind:'Person',x:220,y:140}],edges:[{id:'FIX-E-0000',source_id:'FIX-N-0000',target_id:'FIX-N-0001'},{id:'FIX-E-0001',source_id:'FIX-N-0001',target_id:'FIX-N-0002'},{id:'FIX-E-0002',source_id:'FIX-N-0002',target_id:'FIX-N-0003'}]};const s=document.querySelector('#graph'),d=document.querySelector('#details'),p=new Map(f.nodes.map(n=>[n.id,n])),g=document.createElementNS('http://www.w3.org/2000/svg','g');s.append(g);let scale=1;function render(){g.setAttribute('transform',`translate(${260-260*scale} ${90-90*scale}) scale(${scale})`)}for(const e of f.edges){const a=p.get(e.source_id),b=p.get(e.target_id);const el=document.createElementNS('http://www.w3.org/2000/svg','line');el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y);el.setAttribute('stroke','#d9b46c');el.setAttribute('stroke-width','2');el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',e.id);el.onclick=()=>d.textContent=`${e.id}: ${e.source_id} → ${e.target_id}`;g.append(el)}for(const n of f.nodes){const el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',n.x);el.setAttribute('cy',n.y);el.setAttribute('r','25');el.setAttribute('fill',n.kind==='Person'?'#496b68':'#765b82');el.setAttribute('stroke','#d9b46c');el.setAttribute('tabindex','0');el.setAttribute('role','button');el.setAttribute('aria-label',`${n.label} ${n.id}`);el.onclick=()=>d.textContent=`${n.label} (${n.id})`;g.append(el)}document.querySelector('#zoom-in').onclick=()=>{scale=Math.min(2,scale+.2);render()};document.querySelector('#zoom-out').onclick=()=>{scale=Math.max(.6,scale-.2);render()};document.querySelector('#fit').onclick=()=>{scale=1;render()};render();</script>
