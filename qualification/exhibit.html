<!doctype html><meta charset="utf-8"><title>FGA06 renderer qualification exhibit</title><style>body{font:16px system-ui;background:#17130f;color:#f1e7d0;margin:2rem}svg{background:#211a14;border:1px solid #d9b46c;max-width:900px;width:100%}button{margin:.25rem;padding:.5rem;background:#d9b46c;border:0}#details{margin-top:1rem;padding:1rem;border:1px solid #77644b}</style><h1>FGA06 qualification exhibit</h1><p>This dependency-free baseline proves the shared fixture and semantic fallback path.</p><svg id="graph" viewBox="0 0 520 180" role="img" aria-label="Fixture graph"></svg><div id="details" aria-live="polite">Select a node or relationship.</div><script>const f={nodes:[{id:'FIX-N-0000',label:'Person 0000',x:80,y:90},{id:'FIX-N-0001',label:'Org 0001',x:220,y:40},{id:'FIX-N-0002',label:'Org 0002',x:360,y:90},{id:'FIX-N-0003',label:'Person 0003',x:220,y:140}],edges:[{id:'FIX-E-0000',source_id:'FIX-N-0000',target_id:'FIX-N-0001'},{id:'FIX-E-0001',source_id:'FIX-N-0001',target_id:'FIX-N-0002'},{id:'FIX-E-0002',source_id:'FIX-N-0002',target_id:'FIX-N-0003'}]};const s=document.querySelector('#graph'),d=document.querySelector('#details'),p=new Map(f.nodes.map(n=>[n.id,n]));for(const e of f.edges){const a=p.get(e.source_id),b=p.get(e.target_id);s.insertAdjacentHTML('beforeend',`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#d9b46c" stroke-width="2" tabindex="0" role="button" aria-label="${e.id}"/>`);s.lastChild.onclick=()=>d.textContent=`${e.id}: ${e.source_id} → ${e.target_id}`;}for(const n of f.nodes){s.insertAdjacentHTML('beforeend',`<circle cx="${n.x}" cy="${n.y}" r="25" fill="#496b68" stroke="#d9b46c" tabindex="0" role="button" aria-label="${n.label} ${n.id}"/>`);s.lastChild.onclick=()=>d.textContent=`${n.label} (${n.id})`;}</script>
