name: fraud-graph-arena

x-web-environment: &web-environment
  FGA_ENVIRONMENT: ${FGA_ENVIRONMENT:-production}
  FGA_RUNTIME_ROLE: WEB
  FGA_ROUND_REPOSITORY: ${FGA_ROUND_REPOSITORY:-sqlite}
  FGA_SQLITE_PATH: ${FGA_SQLITE_PATH:-/data/fga.sqlite3}
  FGA_FRONTEND_DIST: /app/apps/web/dist
  FGA_ALLOWED_ORIGINS: ${FGA_ALLOWED_ORIGINS:-[]}

x-web-healthcheck: &web-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=2)"]
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 10s

services:
  web:
    profiles: ["local-build"]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FGA_SOURCE_REVISION: ${FGA_SOURCE_REVISION:-working-tree}
    image: ${FGA_LOCAL_IMAGE:-fraud-graph-arena:local}
    env_file:
      - ./docker/runtime.env
    environment: *web-environment
    ports:
      - "127.0.0.1:${FGA_WEB_PORT:-8000}:8000"
    volumes:
      - fga-local-data:/data
    healthcheck: *web-healthcheck

  postgres:
    profiles: ["postgres"]
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fga}
      POSTGRES_USER: ${POSTGRES_USER:-fga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fga-local-only}
    ports:
      - "127.0.0.1:${FGA_POSTGRES_PORT:-55432}:5432"
    volumes:
      - fga-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  fga-local-data:
  fga-postgres-data:
